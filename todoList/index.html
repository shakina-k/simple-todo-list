<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/normalize.css">
        <link rel="stylesheet" href="css/style.css">

        <title>To Do List</title>
    </head>
    <body>
        <div class="container">
            <h1>To Do List</h1>
            <p>Stay organized by tracking your tasks.</p>
            <div class="taskInput">
                <input type="text" id="task" placeholder="Add a task here" maxlength="100">
                <button id="add">Add</button>
            </div>

            <ul id="taskList"></ul>
        </div>

        
        <script src="js/main.js"></script>
    </body>
</html>
